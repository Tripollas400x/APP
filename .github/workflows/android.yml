name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: APK firmado + tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build and test
        working-directory: android
        run: gradle assembleRelease testDebugUnitTest --no-daemon --stacktrace

      - name: Rename APK
        working-directory: android/app/build/outputs/apk/release
        run: mv app-release.apk PhantomPad.apk

      - name: Upload APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: PhantomPad-APK
          path: android/app/build/outputs/apk/release/PhantomPad.apk
          if-no-files-found: error

  release:
    name: Publicar release (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PhantomPad-APK
          path: artifacts

      - name: Rename APK with version
        working-directory: artifacts
        run: mv PhantomPad.apk "PhantomPad-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
