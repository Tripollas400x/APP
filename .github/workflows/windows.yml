name: Windows CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Receptor + tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore windows/src/PhantomPadReceiver/PhantomPadReceiver.csproj

      - name: Test
        run: dotnet test windows/tests/PhantomPadReceiver.Tests/PhantomPadReceiver.Tests.csproj -c Release --nologo

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish windows/src/PhantomPadReceiver/PhantomPadReceiver.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true
          -o windows/publish

      - name: Empaquetar ZIP
        run: Compress-Archive -Path windows/publish/* -DestinationPath PhantomPadReceiver-win-x64.zip -Force

      - name: Upload receptor ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PhantomPadReceiver-win-x64
          path: PhantomPadReceiver-win-x64.zip
          if-no-files-found: error

  release:
    name: Adjuntar receptor al release (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PhantomPadReceiver-win-x64
          path: artifacts

      - name: Adjuntar ZIP al release (espera a que exista)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "Release encontrado."
              break
            fi
            echo "El release aún no existe (intento $i/40); esperando 15 s..."
            sleep 15
          done
          gh release upload "$GITHUB_REF_NAME" artifacts/PhantomPadReceiver-win-x64.zip -R "$GITHUB_REPOSITORY" --clobber
