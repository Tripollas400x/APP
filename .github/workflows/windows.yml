name: Windows CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Receptor + tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore windows/src/PhantomPadReceiver/PhantomPadReceiver.csproj

      - name: Test
        run: dotnet test windows/tests/PhantomPadReceiver.Tests/PhantomPadReceiver.Tests.csproj -c Release --nologo

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish windows/src/PhantomPadReceiver/PhantomPadReceiver.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true
          -o windows/publish

      - name: Empaquetar ZIP
        run: Compress-Archive -Path windows/publish/* -DestinationPath PhantomPadReceiver-win-x64.zip -Force

      - name: Upload receptor ZIP
        uses: actions/upload-artifact@v7
        with:
          name: PhantomPadReceiver-win-x64
          path: PhantomPadReceiver-win-x64.zip
          if-no-files-found: error

  release:
    name: Publicar release (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/PhantomPadReceiver-win-x64/PhantomPadReceiver-win-x64.zip
          generate_release_notes: true
